[package]
name = "toolbay-flow"
version = "0.4.14"
description = "Toolbay Flow: free, local, open-source voice dictation for any app"
authors = ["Orion Jones"]
license = "MIT"
repository = "https://github.com/sriptcollector/toolbay-flow"
edition = "2021"

[lib]
name = "toolbay_flow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
once_cell = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
regex = "1"
cpal = "0.15"
hound = "3.5"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "sync"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
uiautomation = "0.16"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security",
  "Win32_Graphics_Dxgi",
  "Win32_System_SystemInformation",
  "Win32_System_Recovery",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
core-graphics = "0.24"
core-foundation = "0.10"
core-foundation-sys = "0.8"
accessibility-sys = "0.1"
arboard = "3"
rdev = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
