name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      # Signs update packages so installed copies can update themselves.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Starter model + speech engine that ship inside the installer.
      - run: npm run bundle
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') }}
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: matrix.os == 'windows-latest'
      # macOS: always at least ad-hoc signed with the hardened runtime and
      # Entitlements.plist (signingIdentity "-" in tauri.conf.json), so Gatekeeper
      # offers "Open Anyway" instead of calling the app damaged. Once the Apple
      # secrets exist (docs/SIGNING.md) the same build is signed with the
      # Developer ID certificate, notarized with notarytool and stapled.
      - name: Apple Developer ID signing and notarization (if configured)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID signing: on"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            # codesign matches by name; "Developer ID Application" finds the imported cert.
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:-Developer ID Application}" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarization: on"
              echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              # tauri's notarization reads the app-specific password as APPLE_PASSWORD.
              echo "APPLE_PASSWORD=$APPLE_APP_PASSWORD" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            fi
          else
            echo "No Apple certificate yet: ad-hoc signing only"
          fi
      - name: Windows signing (if configured)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -n "$TRUSTED_SIGNING_ACCOUNT" ]; then
            cargo install trusted-signing-cli --locked
            for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
            node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.bundle.windows.signCommand='trusted-signing-cli -e https://eus.codesigning.azure.net -a $TRUSTED_SIGNING_ACCOUNT -c $TRUSTED_SIGNING_PROFILE -d \"Toolbay Flow\" %1';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Toolbay Flow ${{ github.ref_name }}"
          releaseBody: "Free, local, open-source voice dictation. Download the installer for your computer below. See the README for details."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      # Fail the build if the Mac app or the app inside the DMG isn't properly sealed.
      - name: Verify macOS signature
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          triple=${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          bundle=src-tauri/target/$triple/release/bundle
          app=$(ls -d "$bundle"/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" | grep -q audio-input
          codesign -d --verbose=4 "$app" 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier|Runtime|flags)" || true
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'	' '{print $NF}')
          codesign --verify --deep --strict --verbose=2 "$mnt"/*.app
          hdiutil detach "$mnt"
          # What a person who downloads it will see: quarantine a copy like Safari does
          # and ask Gatekeeper for its verdict (printed, not fatal).
          tmp=$(mktemp -d); cp -R "$app" "$tmp/"; qapp="$tmp/$(basename "$app")"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$qapp"
          echo "Gatekeeper verdict for a downloaded copy:"; spctl -a -vv -t exec "$qapp" 2>&1 || true
          if [ -n "${APPLE_ID:-}" ]; then
            spctl -a -vv --type execute "$app"
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg" || echo "DMG itself not stapled (the app inside is)"
          fi

  manifest:
    # toolbay.json for the Toolbay hub, with the real size and sha256 of each installer.
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "${{ github.ref_name }}" -D assets -p "*.exe" -p "*.dmg"
          node scripts/manifest.mjs assets toolbay.json
          gh release upload "${{ github.ref_name }}" toolbay.json --clobber

  # whisper.cpp has no official macOS server binary, so build one with Metal and
  # attach it to the fixed "engines-v1" release (bundled into the Mac app at build time).
  whisper-macos:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: b5454
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build --config Release -j --target whisper-server
          mkdir out && cp build/bin/whisper-server out/
          tar -czf whisper-server-macos-${{ matrix.arch }}.tar.gz -C out whisper-server
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: engines-v1
          name: "Engines (macOS builds of whisper.cpp)"
          body: "whisper-server built from ggml-org/whisper.cpp b5454 with Metal (MIT). Bundled into Toolbay Flow for macOS."
          files: whisper-server-macos-${{ matrix.arch }}.tar.gz
          make_latest: false
          target_commitish: ${{ github.sha }}
