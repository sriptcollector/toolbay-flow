name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    env:
      # Signs update packages so installed copies can update themselves.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Starter model + speech engine that ship inside the installer.
      - run: npm run bundle
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.os == 'windows-latest' && 'x86_64-pc-windows-msvc' || (contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin') }}
      # Tauri doesn't sign programs placed in Resources (the bundled speech
      # engine), so sign every Mach-O there first: Developer ID when the
      # certificate exists, otherwise ad-hoc. Notarization rejects unsigned ones.
      # Until the Apple certificate exists, sign with Toolbay's own fixed certificate instead of
      # ad-hoc. macOS remembers Accessibility / Input Monitoring by the signing certificate, so
      # with the same certificate on every release those permissions survive updates (ad-hoc
      # signatures change with every build, so macOS treated each update as a new app).
      - name: Toolbay signing certificate (macOS, until the Apple one exists)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MAC_SELFSIGN_P12: ${{ secrets.MAC_SELFSIGN_P12 }}
          MAC_SELFSIGN_PASSWORD: ${{ secrets.MAC_SELFSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_CERTIFICATE:-}" ] || [ -z "${MAC_SELFSIGN_P12:-}" ]; then exit 0; fi
          kc=$RUNNER_TEMP/toolbay.keychain-db; pw=$(uuidgen)
          echo "$MAC_SELFSIGN_P12" | base64 --decode > $RUNNER_TEMP/self.p12
          security create-keychain -p "$pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$pw" "$kc"
          security import $RUNNER_TEMP/self.p12 -k "$kc" -P "$MAC_SELFSIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          # codesign only uses a self-signed identity that's trusted for code signing.
          openssl pkcs12 -in $RUNNER_TEMP/self.p12 -passin pass:"$MAC_SELFSIGN_PASSWORD" -nokeys -legacy -out $RUNNER_TEMP/self.pem 2>/dev/null \
            || openssl pkcs12 -in $RUNNER_TEMP/self.p12 -passin pass:"$MAC_SELFSIGN_PASSWORD" -nokeys -out $RUNNER_TEMP/self.pem
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain $RUNNER_TEMP/self.pem
          rm $RUNNER_TEMP/self.p12
          security find-identity -v -p codesigning "$kc"
          echo "SELF_SIGN_ID=Toolbay Flow Signing" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=Toolbay Flow Signing" >> "$GITHUB_ENV"
      - name: Sign bundled engines (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          id="${SELF_SIGN_ID:--}"; extra=()
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            kc=$RUNNER_TEMP/engines.keychain-db; pw=$(uuidgen)
            echo "$APPLE_CERTIFICATE" | base64 --decode > $RUNNER_TEMP/cert.p12
            security create-keychain -p "$pw" "$kc"
            security set-keychain-settings -lut 3600 "$kc"
            security unlock-keychain -p "$pw" "$kc"
            security import $RUNNER_TEMP/cert.p12 -k "$kc" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple: -s -k "$pw" "$kc" >/dev/null
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            rm $RUNNER_TEMP/cert.p12
            id="Developer ID Application"; extra=(--timestamp)
          fi
          find src-tauri/bundled -type f | while read -r f; do
            if file "$f" | grep -q Mach-O; then
              codesign --force --options runtime ${extra[@]+"${extra[@]}"} -s "$id" "$f"
              codesign --verify --strict --verbose=2 "$f"
            fi
          done
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: matrix.os == 'windows-latest'
      # macOS: always at least ad-hoc signed with the hardened runtime and
      # Entitlements.plist (signingIdentity "-" in tauri.conf.json), so Gatekeeper
      # offers "Open Anyway" instead of calling the app damaged. Once the Apple
      # secrets exist (docs/SIGNING.md) the same build is signed with the
      # Developer ID certificate, notarized with notarytool and stapled.
      - name: Apple Developer ID signing and notarization (if configured)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID signing: on"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            # codesign matches by name; "Developer ID Application" finds the imported cert.
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:-Developer ID Application}" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarization: on"
              echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              # tauri's notarization reads the app-specific password as APPLE_PASSWORD.
              echo "APPLE_PASSWORD=$APPLE_APP_PASSWORD" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            fi
          elif [ -n "${SELF_SIGN_ID:-}" ]; then
            echo "No Apple certificate yet: signing with $SELF_SIGN_ID"
          else
            echo "No Apple certificate yet: ad-hoc signing only"
          fi
      - name: Windows signing (if configured)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -n "$TRUSTED_SIGNING_ACCOUNT" ]; then
            cargo install trusted-signing-cli --locked
            for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
            node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.bundle.windows.signCommand='trusted-signing-cli -e https://eus.codesigning.azure.net -a $TRUSTED_SIGNING_ACCOUNT -c $TRUSTED_SIGNING_PROFILE -d \"Toolbay Flow\" %1';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          fi
      - name: Parity coverage
        shell: bash
        run: echo "PARITY=$(node scripts/parity.mjs)" >> "$GITHUB_ENV"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Toolbay Flow ${{ github.ref_name }}"
          releaseBody: "Free, local, open-source voice dictation. Download the installer for your computer below (Mac: the .pkg). See the README for details.

Parity with Wispr Flow: ${{ env.PARITY }}."
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
      # Fail the build if the Mac app or the app inside the DMG isn't properly sealed.
      - name: Verify macOS signature
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          triple=${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          bundle=src-tauri/target/$triple/release/bundle
          app=$(ls -d "$bundle"/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" | grep -q audio-input
          # Every bundled program inside Resources is signed and runs.
          find "$app/Contents/Resources" -type f | while read -r f; do
            if file "$f" | grep -q Mach-O; then
              codesign --verify --strict --verbose=2 "$f"
              if [[ "$f" == *whisper-server* ]] && [[ "$triple" == aarch64* ]]; then
                rc=0; "$f" --help >/dev/null 2>&1 || rc=$?
                # A signing problem kills the process (exit 128+); usage errors are fine.
                if [ "$rc" -ge 128 ]; then echo "engine won't run ($rc): $f"; exit 1; fi
              fi
            fi
          done
          codesign -d --verbose=4 "$app" 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier|Runtime|flags)" || true
          # Permissions follow this requirement; it must name the certificate, not a build hash.
          codesign -d -r- "$app" 2>&1 | tail -1
          if [ -n "${SELF_SIGN_ID:-}" ]; then
            codesign -d --verbose=4 "$app" 2>&1 | grep -q "Authority=$SELF_SIGN_ID"
            codesign -d -r- "$app" 2>&1 | grep -q "certificate"
          fi
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'	' '{print $NF}')
          codesign --verify --deep --strict --verbose=2 "$mnt"/*.app
          hdiutil detach "$mnt"
          # What a person who downloads it will see: quarantine a copy like Safari does
          # and ask Gatekeeper for its verdict (printed, not fatal).
          tmp=$(mktemp -d); cp -R "$app" "$tmp/"; qapp="$tmp/$(basename "$app")"
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$qapp"
          echo "Gatekeeper verdict for a downloaded copy:"; spctl -a -vv -t exec "$qapp" 2>&1 || true
          if [ -n "${APPLE_ID:-}" ]; then
            spctl -a -vv --type execute "$app"
            xcrun stapler validate "$app"
            xcrun stapler validate "$dmg" || echo "DMG itself not stapled (the app inside is)"
          fi

      # A .pkg installer for people downloading from the web. macOS treats an
      # unsigned installer package as "unidentified developer" (Open Anyway),
      # not "damaged", and apps it installs aren't flagged as downloaded, so
      # Toolbay Flow then opens normally. Signed with Developer ID Installer once
      # that certificate exists (APPLE_INSTALLER_IDENTITY).
      - name: macOS installer package
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          triple=${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          arch=${{ contains(matrix.args, 'aarch64') && 'aarch64' || 'x64' }}
          ver=${GITHUB_REF_NAME#v}
          app=$(ls -d src-tauri/target/$triple/release/bundle/macos/*.app | head -1)
          chmod +x scripts/macos-pkg/postinstall
          out="Toolbay.Flow_${ver}_${arch}.pkg"
          sign=()
          if [ -n "${APPLE_INSTALLER_IDENTITY:-}" ]; then sign=(--sign "$APPLE_INSTALLER_IDENTITY"); fi
          # Fixed location: never "relocate" the install onto an old copy elsewhere.
          root=$(mktemp -d); cp -R "$app" "$root/"
          pkgbuild --analyze --root "$root" comp.plist
          plutil -replace 0.BundleIsRelocatable -bool NO comp.plist
          pkgbuild --root "$root" --component-plist comp.plist --install-location /Applications             --identifier ai.toolbay.flow.pkg --version "$ver" --scripts scripts/macos-pkg ${sign[@]+"${sign[@]}"} "$out"
          # Gatekeeper's verdict for the downloaded package (printed, not fatal).
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$out"
          echo "Gatekeeper verdict for the downloaded .pkg:"; spctl -a -vv -t install "$out" 2>&1 || true
          xattr -d com.apple.quarantine "$out"
          # Prove it installs and the installed app is intact and not flagged.
          sudo installer -pkg "$out" -target /
          codesign --verify --deep --strict --verbose=2 "/Applications/Toolbay Flow.app"
          if xattr -p com.apple.quarantine "/Applications/Toolbay Flow.app" 2>/dev/null; then echo "installed app is quarantined"; exit 1; fi
          echo "Installed app is clean."
          # Same file under a fixed name, so .../releases/latest/download/Toolbay.Flow_<arch>.pkg
          # always points at the newest version.
          cp "$out" "Toolbay.Flow_${arch}.pkg"
          gh release upload "$GITHUB_REF_NAME" "$out" "Toolbay.Flow_${arch}.pkg" --clobber

  manifest:
    # toolbay.json for the Toolbay hub, with the real size and sha256 of each installer.
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "${{ github.ref_name }}" -D assets -p "*.exe" -p "*.dmg"
          node scripts/manifest.mjs assets toolbay.json
          gh release upload "${{ github.ref_name }}" toolbay.json --clobber
          # Fixed-name Windows installer for .../releases/latest/download/Toolbay.Flow_x64-setup.exe
          cp assets/*_x64-setup.exe Toolbay.Flow_x64-setup.exe
          gh release upload "${{ github.ref_name }}" Toolbay.Flow_x64-setup.exe --clobber

  # whisper.cpp has no official macOS server binary, so build one with Metal and
  # attach it to the fixed "engines-v1" release (bundled into the Mac app at build time).
  whisper-macos:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        arch: [arm64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/whisper.cpp
          ref: b5454
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}
          cmake --build build --config Release -j --target whisper-server
          mkdir out && cp build/bin/whisper-server out/
          tar -czf whisper-server-macos-${{ matrix.arch }}.tar.gz -C out whisper-server
      - uses: softprops/action-gh-release@v2
        with:
          repository: ${{ github.repository }}
          tag_name: engines-v1
          name: "Engines (macOS builds of whisper.cpp)"
          body: "whisper-server built from ggml-org/whisper.cpp b5454 with Metal (MIT). Bundled into Toolbay Flow for macOS."
          files: whisper-server-macos-${{ matrix.arch }}.tar.gz
          make_latest: false
          target_commitish: ${{ github.sha }}
